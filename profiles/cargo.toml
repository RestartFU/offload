# Rust builds and tests. Use with: offload run --profile cargo -- cargo build
kind = "job"
description = "Rust (cargo) builds and tests"
match = ["cargo", "cargo-*", "rustc", "rustup"]   # picked automatically for these commands

[resources]
cpu = 4        # guaranteed share
mem = "8G"     # hard limit; raise per job with --mem
# cpu_max defaults to every core the runner allows, so an idle runner builds at full speed.

[env]
CARGO_TERM_PROGRESS_WHEN = "never"
