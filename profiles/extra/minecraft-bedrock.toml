# Minecraft Bedrock MCP (mcpelauncher-agent) on a private Xvfb display with software rendering.
# Not installed by default. Today this runs on the runner host (runtime = "host"), because the
# launcher fork ships as a flatpak; the host needs Xvfb + xauth, flatpak with the fork and its KDE
# runtime, bun, mcpelauncher-agent, and the game data. Copy this file into
# ~/.config/offload/profiles/ on that runner once those exist.
kind = "session"
runtime = "host"
description = "Minecraft Bedrock client MCP (headless, Xvfb + llvmpipe)"
command = ["bun", "run", "~/.local/share/mcpelauncher-agent/src/index.ts"]

[resources]
cpu = 2
cpu_max = 6     # llvmpipe rendering is CPU-bound
mem = "4G"

[env]
PATH = "~/.bun/bin:~/.local/bin:/usr/local/bin:/usr/bin:/bin"
MCPELAUNCHER_CLIENT = "~/.local/bin/mcpelauncher-headless"
MCPELAUNCHER_SOCKET_DIR = "~/.var/app/io.mrarm.mcpelauncher/data"
MCPELAUNCHER_DATA = "~/.var/app/io.mrarm.mcpelauncher/data/mcpelauncher"
MCPELAUNCHER_ABI = "x86_64"
